<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monopolyer original-artwork overlay review</title><style>body{font:16px system-ui;margin:0;background:#f2f5f3;color:#18342b}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:28px;margin:0 0 12px}label{display:block;margin:16px 0}select{font:inherit;max-width:100%;padding:8px}input{vertical-align:middle;width:240px}#stage{position:relative;background:white;border:1px solid #81938a;max-width:100%;margin:auto}#stage img{display:block;width:100%}#current{position:absolute;inset:0}#difference{display:none}#note{max-width:900px}#stats{font-family:monospace;padding:12px;background:#e2eae5}a{color:#005699}button{font:inherit;padding:8px;margin-right:8px}</style><main><h1>Original artwork overlay review</h1><p>These comparisons distinguish exact source rendering, intentional branding/grid changes, and forced font-recreation diagnostics. A zero difference in source mode does not imply that all retyped text is pixel-identical to Photoshop.</p><label>Comparison <select id="choice"></select></label><p id="note"></p><p id="stats"></p><label>Current layer opacity <input id="opacity" type="range" min="0" max="100" value="50"> <output id="value">50%</output></label><button id="showOriginal">Original</button><button id="showOverlay">50% overlay</button><button id="showCurrent">Current</button><button id="showDifference">Difference x4</button><div id="stage"><img id="original" alt="Original reference"><img id="current" alt="Current rendering"><img id="difference" alt="Difference amplified four times"></div></main><script>const entries=[{"key":"campus-exact","title":"Campus board: original-pixel mode","note":"Unchanged source artwork. Compared at the original 6000 x 6000 resolution.","width":6000,"height":6000,"meanAbsoluteError":0.0,"changedPixels":0,"pixelsOver32Percent":0.0,"original":"images/30eedb42f9dff66c7366.png","current":"images/30eedb42f9dff66c7366.png","difference":"images/4fb1aaed33a49d267335.png"},{"key":"campus-clean","title":"Campus board: clean grid","note":"Intentional geometric grid and color-band replacement. Text, title and illustrations still use source artwork.","width":6000,"height":6000,"meanAbsoluteError":2.261637,"changedPixels":431794,"pixelsOver32Percent":1.168861,"original":"images/30eedb42f9dff66c7366.png","current":"images/d19caa4441e9fd447d3e.png","difference":"images/6ec8a2ff6a026f714226.png"},{"key":"photoshop-exact","title":"Photoshop board: original-pixel mode","note":"Unchanged source artwork. Compared at the original 6000 x 6000 resolution.","width":6000,"height":6000,"meanAbsoluteError":0.0,"changedPixels":0,"pixelsOver32Percent":0.0,"original":"images/91abd340d8e0b33abbc8.png","current":"images/24a3e84d4d7ff101ec51.png","difference":"images/384d16d8da95b4b9486d.png"},{"key":"photoshop-clean","title":"Photoshop board: clean grid","note":"Intentional geometric grid and color-band replacement. Text, title and illustrations still use source artwork.","width":6000,"height":6000,"meanAbsoluteError":2.190491,"changedPixels":431794,"pixelsOver32Percent":1.167961,"original":"images/91abd340d8e0b33abbc8.png","current":"images/8904b41f39db2b0fc315.png","difference":"images/480a5e89ffca5760c820.png"},{"key":"board-text","title":"Board labels and edited prices: forced rebuild","note":"Diagnostic: original words are forced through the edited-text path. Original labels normally retain their cached pixels. The price adapter retains mixed-size source glyphs.","width":390,"height":505,"meanAbsoluteError":9.217803,"changedPixels":15482,"pixelsOver32Percent":6.350343,"original":"images/9205083d57f615ddc066.png","current":"images/08b7cca1bb3442f85bec.png","difference":"images/041ed8a4276aa82be606.png"},{"key":"deed-exact","title":"Property deed: original source lettering","note":"Independent Photoshop composite baseline; original source lettering is retained.","width":788,"height":900,"meanAbsoluteError":0.285353,"changedPixels":48411,"pixelsOver32Percent":0.0,"original":"images/c42a40fab9871a293619.png","current":"images/07f2aa9948d369fc1a42.png","difference":"images/503cde5ef82a054ef434.png"},{"key":"deed-native","title":"Property deed: forced font recreation","note":"Diagnostic: text caches are bypassed. Differences include native font rasterization and text layout; this is not the default unchanged-card renderer.","width":788,"height":900,"meanAbsoluteError":4.627102,"changedPixels":33002,"pixelsOver32Percent":3.69529,"original":"images/07f2aa9948d369fc1a42.png","current":"images/4576e0b5d405dcce167f.png","difference":"images/65ab0db5037902517f1c.png"},{"key":"event-exact","title":"Event card: original source lettering","note":"Independent Photoshop composite baseline; original source lettering is retained.","width":900,"height":525,"meanAbsoluteError":0.634732,"changedPixels":42428,"pixelsOver32Percent":0.725714,"original":"images/ce7530e99433f2a5bcf4.png","current":"images/c93e423454aece25ba19.png","difference":"images/95778d9d21994eb1fb80.png"},{"key":"event-native","title":"Event card: forced font recreation","note":"Diagnostic: text caches are bypassed. Differences include native font rasterization and text layout; this is not the default unchanged-card renderer.","width":900,"height":525,"meanAbsoluteError":17.609387,"changedPixels":41867,"pixelsOver32Percent":8.444444,"original":"images/c93e423454aece25ba19.png","current":"images/8300ca4ee33f8cbc14e0.png","difference":"images/f66023bca30074c9d1a6.png"},{"key":"event-native-reference","title":"Event card: native font with original whitespace","note":"Diagnostic using the original text, source anchors and original trailing spaces, rather than the builder's rewrapped text.","width":900,"height":525,"meanAbsoluteError":6.786022,"changedPixels":21746,"pixelsOver32Percent":4.065185,"original":"images/c93e423454aece25ba19.png","current":"images/2c76d93209b59a3228e7.png","difference":"images/da581d35558967e66d83.png"},{"key":"northern","title":"Northern Health preset vs original","note":"Intentional changes: Northern Health SVG + opoly in #005699 and a clean geometric grid. The mint background and property palette are retained.","width":6000,"height":6000,"meanAbsoluteError":5.971033,"changedPixels":1379663,"pixelsOver32Percent":3.768564,"original":"images/30eedb42f9dff66c7366.png","current":"images/9e51a00b71016f7da877.png","difference":"images/17daada42977ed2d1530.png"},{"key":"northern-vector","title":"Northern Health: source export vs vector export","note":"Measures traced source-art edges against the source-matched export. Vector tracing is not pixel-identical to the original raster artwork.","width":6000,"height":6000,"meanAbsoluteError":0.901368,"changedPixels":1673211,"pixelsOver32Percent":0.989222,"original":"images/9e51a00b71016f7da877.png","current":"images/90cc0f329344005069d7.png","difference":"images/b8f377f08622c16ad043.png"},{"key":"bill-1","title":"1 bill: supplied PDF vs unchanged SVG","note":"PDF-crop and browser SVG rasterizers differ at thin lines. Use the PDF overlay report for a PDF-to-PDF comparison.","width":1030,"height":490,"meanAbsoluteError":5.098292,"changedPixels":156862,"pixelsOver32Percent":3.626511,"original":"images/a050b75c0286be8c19ed.png","current":"images/ee4d6aee792ce2001110.png","difference":"images/5b124a8bd37a5b298032.png"},{"key":"bill-5","title":"5 bill: supplied PDF vs unchanged SVG","note":"PDF-crop and browser SVG rasterizers differ at thin lines. Use the PDF overlay report for a PDF-to-PDF comparison.","width":1030,"height":490,"meanAbsoluteError":4.927719,"changedPixels":419973,"pixelsOver32Percent":3.585694,"original":"images/8526a38a3991c12b76b7.png","current":"images/63faaf49d7fa11960fc7.png","difference":"images/3a19fa803b27fbfee58a.png"},{"key":"bill-10","title":"10 bill: supplied PDF vs unchanged SVG","note":"PDF-crop and browser SVG rasterizers differ at thin lines. Use the PDF overlay report for a PDF-to-PDF comparison.","width":1030,"height":490,"meanAbsoluteError":4.83664,"changedPixels":413435,"pixelsOver32Percent":3.665544,"original":"images/36d03c5a4d8e4fbff7bc.png","current":"images/be10b9bc396c741ad2fe.png","difference":"images/e053f659c9bda1abe359.png"},{"key":"bill-20","title":"20 bill: supplied PDF vs unchanged SVG","note":"PDF-crop and browser SVG rasterizers differ at thin lines. Use the PDF overlay report for a PDF-to-PDF comparison.","width":1030,"height":490,"meanAbsoluteError":4.493805,"changedPixels":163301,"pixelsOver32Percent":2.654052,"original":"images/0088629e97c2e9823ae6.png","current":"images/867978322d7337e582e2.png","difference":"images/2081539da73fe94d3977.png"},{"key":"bill-50","title":"50 bill: supplied PDF vs unchanged SVG","note":"PDF-crop and browser SVG rasterizers differ at thin lines. Use the PDF overlay report for a PDF-to-PDF comparison.","width":1030,"height":490,"meanAbsoluteError":4.82435,"changedPixels":411430,"pixelsOver32Percent":2.958589,"original":"images/da5e59c5524ebd5a50f4.png","current":"images/5bf93efd9769e0f645bd.png","difference":"images/87dc37b87940ccd66444.png"},{"key":"bill-100","title":"100 bill: supplied PDF vs unchanged SVG","note":"PDF-crop and browser SVG rasterizers differ at thin lines. Use the PDF overlay report for a PDF-to-PDF comparison.","width":1030,"height":490,"meanAbsoluteError":4.551418,"changedPixels":405025,"pixelsOver32Percent":3.294829,"original":"images/af09bf8055349e72b0af.png","current":"images/1dcd0b48ef553c1d9a79.png","difference":"images/edf045039772e11e427e.png"},{"key":"bill-500","title":"500 bill: supplied PDF vs unchanged SVG","note":"PDF-crop and browser SVG rasterizers differ at thin lines. Use the PDF overlay report for a PDF-to-PDF comparison.","width":1030,"height":490,"meanAbsoluteError":4.10294,"changedPixels":403069,"pixelsOver32Percent":3.911234,"original":"images/6247058e9670caf25d2b.png","current":"images/0f0cc6eb749da749b270.png","difference":"images/b9c93da036cb9094b003.png"},{"key":"bill-northern","title":"Northern Health bill vs original one-dollar bill","note":"Intentional renamed curved heading using original Myriad outlines plus the supplied missing-letter outlines. The preset prints all denominations in black and white.","width":1030,"height":490,"meanAbsoluteError":5.771692,"changedPixels":157987,"pixelsOver32Percent":3.979394,"original":"images/a050b75c0286be8c19ed.png","current":"images/53e523bb7ab4f20a9d48.png","difference":"images/8c7d05f0349f24817cec.png"}];const $=id=>document.getElementById(id);entries.forEach((e,i)=>{const o=document.createElement('option');o.value=i;o.textContent=e.title;$('choice').append(o)});function opacity(n){$('opacity').value=n;$('value').textContent=n+'%';$('original').style.display='block';$('current').style.display='block';$('difference').style.display='none';$('current').style.opacity=n/100}function select(){const e=entries[$('choice').value];$('original').src=e.original;$('current').src=e.current;$('difference').src=e.difference;$('stage').style.width=Math.min(e.width,1100)+'px';$('note').textContent=e.note;$('stats').textContent=e.width+' x '+e.height+' pixels; mean difference '+e.meanAbsoluteError+'/255; pixels differing by >32: '+e.pixelsOver32Percent+'%; any changed pixels: '+e.changedPixels;opacity(50)}$('choice').onchange=select;$('opacity').oninput=e=>opacity(e.target.value);$('showOriginal').onclick=()=>opacity(0);$('showOverlay').onclick=()=>opacity(50);$('showCurrent').onclick=()=>opacity(100);$('showDifference').onclick=()=>{$('current').style.display='none';$('original').style.display='none';$('difference').style.display='block'};select();</script></html>
